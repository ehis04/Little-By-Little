# Local development database: Postgres with PostGIS. `make db-up` starts it.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lbl
      POSTGRES_PASSWORD: lbl
      POSTGRES_DB: lbl
    ports:
      - "5432:5432"
    volumes:
      - lbl-pgdata:/var/lib/postgresql/data
      # Creates the separate lbl_test database used by integration tests.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbl -d lbl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lbl-pgdata:
